# monitoring stack: Prometheus/Grafana/cAdvisor observability + alerting +
# notifications + self-healing.
#
# Prometheus + Grafana publish on 127.0.0.1 only and also join the external
# `frontend` network so homepage can reach them by name. Grafana is exposed
# publicly as grf.example.com via the reverse proxy + forward-auth SSO.
# Prometheus stays local-only (SSH-tunnel 127.0.0.1:9090 for the expr browser).
# uptime-kuma runs host-networked; its UI is 10.0.0.10:3002 (no reverse-proxy vhost).
#
# Alerting path:  Prometheus rules -> alertmanager -> alertmanager-gotify -> gotify
#   gotify UI/API: http://10.0.0.10:8070  (LAN + VPN mesh only; token auth)
# Image updates: Renovate opens a PR per bump against this repo (see
#   ../renovate.json + .github/workflows/renovate.yml). Watchtower was removed
#   2026-09-07 — its upstream is abandoned.
# autoheal restarts any container labelled `autoheal=true` when it goes
#   unhealthy — deliberately NOT the databases / authelia.
#
# loki + alloy: centralized log aggregation. Alloy (grafana/alloy, which
#   replaced the deprecated promtail on 2026-09-07) discovers every running
#   container via the docker socket (read-only) and ships its logs to loki;
#   point Grafana's Explore tab at it to search/correlate logs alongside the
#   Prometheus metrics. 14-day retention (compactor). Local-only — no
#   reverse-proxy vhost.
#
# nut-exporter: scrapes the NUT server (upsd) on whichever host owns the UPS
#   USB link — usually the hypervisor or NAS, not the Docker host. Alert rules
#   in prometheus/rules/ups.yml. A bare-metal nut-client on the other machines
#   is optional: if the UPS host halts on low battery, a hypervisor stopping
#   its guests (ACPI / guest agent) already shuts them down cleanly.
#
# Secrets (gotify admin pass, per-app tokens) live
# in ./.env (chmod 600, gitignored). ./.env.example documents every key.
name: monitoring

x-common: &common
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  prometheus:
    <<: *common
    mem_limit: 2g
    pids_limit: 512
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      # so the "Go to source" link in gotify alerts is reachable (SSH-tunnel to :9090)
      - "--web.external-url=http://127.0.0.1:9090/"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - default
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  node-exporter:
    <<: *common
    mem_limit: 256m
    pids_limit: 256
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run)($$|/)"
      # cron scripts drop *.prom files here (backup / snapshot / restic /
      # restore-drill / cert freshness) — a lightweight way to get ad-hoc
      # script results into Prometheus without writing a custom exporter.
      - "--collector.textfile.directory=/host/docker/monitoring/textfile"
    volumes:
      - /:/host:ro,rslave
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  nut-exporter:
    <<: *common
    mem_limit: 128m
    pids_limit: 128
    image: ghcr.io/druggeri/nut_exporter:latest
    container_name: nut-exporter
    restart: unless-stopped
    environment:
      # NUT server = whichever host has the UPS on USB and runs nut-server
      # (upsd). Often the hypervisor or the NAS rather than the Docker host.
      # Read-only VAR listing over the network needs no NUT credentials.
      - NUT_EXPORTER_SERVER=10.0.0.9
      - NUT_EXPORTER_UPS=myups
      - NUT_EXPORTER_VARIABLES=battery.charge,battery.runtime,battery.voltage,input.voltage,output.voltage,ups.load,ups.status,ups.realpower,ups.realpower.nominal,ups.temperature
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9199/ups_metrics?ups=myups"]
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    <<: *common
    mem_limit: 512m
    pids_limit: 512
    # :latest on gcr.io is stale and never moves; pinned to the running digest.
    # Check https://github.com/google/cadvisor/releases and bump deliberately.
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    <<: *common
    mem_limit: 1g
    pids_limit: 1024
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - prometheus
    environment:
      - TZ=America/New_York
      - GF_SERVER_ROOT_URL=https://grf.example.com
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # SSO via the forward-auth headers the reverse proxy passes through
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Remote-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_SYNC_TTL=60
      - GF_AUTH_PROXY_WHITELIST=172.16.0.0/12,127.0.0.1
      - GF_AUTH_PROXY_HEADERS=Email:Remote-Email Name:Remote-Name Groups:Remote-Groups
      # issue a session cookie after header auth, so an authenticated admin
      # keeps full rights on the /api/* routes carved out for the embeds
      - GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN=true
      # Anonymous read-only access + framing, for the panel embeds on homepage.
      # The reverse proxy only lets /d-solo + assets + query API reach these
      # unauthenticated; the interactive UI stays behind forward-auth 2FA.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_COOKIE_SAMESITE=lax
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"

  uptime-kuma:
    <<: *common
    mem_limit: 512m
    pids_limit: 512
    image: louislam/uptime-kuma:1.23.16
    container_name: uptime-kuma
    restart: unless-stopped
    network_mode: host              # reach 127.0.0.1:<svc> origins + LAN + public URLs
    environment:
      - TZ=America/New_York
      - UPTIME_KUMA_PORT=3002       # LAN-only UI at http://10.0.0.10:3002 (no reverse-proxy vhost)
      - UPTIME_KUMA_HOST=10.0.0.10  # bind the LAN IP only, never 0.0.0.0
    volumes:
      - ./uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker Container monitors
    extra_hosts:
      - "example.com:127.0.0.1"    # origin check hits the reverse proxy directly, not the public edge
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"

  dozzle:
    <<: *common
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    environment:
      - TZ=America/New_York
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: live container logs in the browser
    ports:
      - "127.0.0.1:8087:8080"    # for the reverse-proxy vhost (LAN reaches it there)
    networks:
      - default
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"

  # --- notifications ------------------------------------------------------------
  gotify:
    <<: *common
    mem_limit: 128m
    pids_limit: 128
    image: gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - GOTIFY_SERVER_SSL_ENABLED=false
      - GOTIFY_REGISTRATION=false
      - GOTIFY_PASSSTRENGTH=10
      - GOTIFY_DEFAULTUSER_NAME=admin
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_DEFAULTUSER_PASS:?set in monitoring/.env}
    volumes:
      - gotify_data:/app/data
    ports:
      - "127.0.0.1:8070:80"
      - "10.0.0.10:8070:80"    # LAN + mesh-VPN reachable
    networks:
      - default
      - frontend
    labels:
      # no autoheal here: the alert path runs THROUGH gotify, and a mis-firing
      # healthcheck + autoheal would loop it. Watch gotify from uptime-kuma.
      - "com.centurylinklabs.watchtower.enable=false"   # pin gotify; update by hand
    healthcheck:
      # gotify/server (debian) ships curl, not wget
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- alert routing ---------------------------------------------------------
  alertmanager:
    <<: *common
    mem_limit: 256m
    pids_limit: 256
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
      - "--web.external-url=http://127.0.0.1:9093/"
      # single node — disable the gossip cluster. With it enabled, this AM
      # wedged its dispatcher after a batch of failed notifications and
      # stopped delivering until restarted. HA clustering is for AM pairs only.
      - "--cluster.listen-address="
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/smtp_password:/etc/alertmanager/smtp_password:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - default
      - frontend          # so homepage can health-check + widget alertmanager:9093
    depends_on:
      - alertmanager-gotify
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Alertmanager has no native Gotify receiver — this translates its webhook
  # payload into Gotify messages. Alert `priority` annotation -> Gotify priority.
  alertmanager-gotify:
    <<: *common
    mem_limit: 128m
    pids_limit: 128
    image: ghcr.io/druggeri/alertmanager_gotify_bridge:latest
    container_name: alertmanager-gotify
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - GOTIFY_ENDPOINT=http://gotify:80
      # empty until the gotify bootstrap step runs; recreate this container afterwards
      - GOTIFY_TOKEN=${GOTIFY_TOKEN_ALERTMANAGER:-}
      # bind :8080 and path /gotify_webhook are the image defaults
      - DEFAULT_PRIORITY=5
      - EXTENDED_DETAILS=true
    networks:
      - default
    depends_on:
      - gotify
    labels:
      - "autoheal=true"

  # --- self-healing --------------------------------------------------------------
  # Restarts a container ONLY when Docker reports it `unhealthy` AND it carries
  # the `autoheal=true` label. Databases, authelia, immich_server and emby are
  # deliberately excluded (a mid-flight restart there does more harm than good).
  autoheal:
    <<: *common
    mem_limit: 64m
    pids_limit: 64
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  loki:
    <<: *common
    mem_limit: 512m
    pids_limit: 256
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    # no healthcheck: this image is distroless (no wget/sh/curl) and Loki has
    # no built-in healthcheck subcommand, same situation as alertmanager-gotify.

  # alloy: replaced promtail 2026-09-07 — Grafana deprecated promtail (Feb 2025)
  #   in favour of Alloy. Same job: discover every running container over the
  #   docker socket and ship its logs to loki. Alloy reads logs through the
  #   Docker API, so unlike promtail it needs no /var/lib/docker/containers bind.
  #   Config is River (config.alloy), converted 1:1 from the old promtail YAML.
  #   Debug UI on 127.0.0.1:12345; --disable-reporting = no phone-home.
  alloy:
    <<: *common
    mem_limit: 256m
    pids_limit: 256
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy

volumes:
  gotify_data:
  alertmanager_data:
  loki_data:
  alloy_data:

networks:
  default:
  frontend:
    external: true
