global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: homelab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: prometheus

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          instance: homelab-01

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: homelab-01

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: homelab-01

  # Grafana Alloy — the log shipper (replaced promtail 2026-09-07). Its own
  # /metrics expose loki.write / loki.source.docker pipeline counters; see
  # rules/monitoring.yml for the Alloy* alerts.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          instance: homelab-01

  - job_name: nut
    metrics_path: /ups_metrics
    params:
      ups: ["myups"]
    static_configs:
      - targets: ["nut-exporter:9199"]
        labels:
          instance: ups-host
