# The monitoring stack watching itself.
groups:
  - name: monitoring
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          priority: "5"
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unscrapeable for 5 minutes."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          priority: "8"
          summary: "Prometheus config reload failed"
          description: "The running Prometheus config is stale — the last reload on {{ $labels.instance }} errored."

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          priority: "4"
          summary: "Prometheus rule evaluations failing"
          description: "{{ $value }} rule-eval failures in 10m on {{ $labels.instance }} — a rule file is probably malformed."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          priority: "8"
          summary: "Alertmanager is down"
          description: "Alerts cannot be delivered — Alertmanager on {{ $labels.instance }} is unreachable."

      - alert: AlertmanagerNotificationFailures
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          priority: "5"
          summary: "Alertmanager failing to deliver notifications"
          description: "{{ $value }} failed notifications in 15m via {{ $labels.integration }} — check the gotify bridge / gotify."

      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          priority: "5"
          summary: "cAdvisor is down"
          description: "Per-container metrics are unavailable — cAdvisor on {{ $labels.instance }} is unreachable."

      # --- Grafana Alloy (log shipping to Loki; replaced promtail 2026-09-07) ---
      - alert: AlloyDown
        expr: up{job="alloy"} == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          priority: "5"
          summary: "Alloy is down"
          description: "Container logs are no longer being shipped to Loki — Alloy on {{ $labels.instance }} has been unscrapeable for 10 minutes."

      - alert: AlloyNotShippingLogs
        expr: |
          up{job="alloy"} == 1
          and on (instance)
          sum by (instance) (rate(loki_write_sent_entries_total[15m])) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          priority: "5"
          summary: "Alloy is up but shipping no logs"
          description: "Alloy on {{ $labels.instance }} has pushed zero log entries to Loki for 30m while running — the pipeline has stalled (bad config reload, docker.sock, or Loki refusing every write). Some running containers always log."

      - alert: AlloyLogDeliveryFailing
        expr: sum by (instance) (rate(loki_write_dropped_entries_total[10m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          priority: "5"
          summary: "Alloy is dropping log entries"
          description: "Alloy on {{ $labels.instance }} is dropping entries on the way to Loki for 15m ({{ $value | printf \"%.2f\" }}/s) — check Loki health, disk, and ingestion limits. (A brief burst right after an Alloy restart is the one-time backlog replay and clears itself well inside the 15m window.)"
