#
# Immich - https://docs.immich.app/install/docker-compose
# Base template from: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Local changes: bind published port to 127.0.0.1 (host reverse proxy fronts it), add TZ,
# exclude from Watchtower auto-updates (Immich upgrades need to be done deliberately),
# add security_opt no-new-privileges + json-file log rotation + mem/pids limits to
# every service, wait for redis+db health before starting the server.
#

name: immich

x-wt-exclude: &wt-exclude
  com.centurylinklabs.watchtower.enable: "false"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  immich-server:
    <<: *hardening
    mem_limit: 4g
    pids_limit: 2048
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    labels: *wt-exclude
    volumes:
      - ${UPLOAD_LOCATION:-./library}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    <<: *hardening
    mem_limit: 8g
    pids_limit: 2048
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    labels:
      <<: *wt-exclude
      autoheal: "true"        # stateless inference — safe to auto-restart when unhealthy
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    <<: *hardening
    mem_limit: 512m
    pids_limit: 256
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    labels: *wt-exclude
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    <<: *hardening
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 60s
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    labels: *wt-exclude
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:-./postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
