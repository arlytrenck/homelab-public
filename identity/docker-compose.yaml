# identity stack — Authelia (forward-auth for *.example.com via the host reverse proxy).
#   Published on 127.0.0.1 only; the reverse proxy fronts auth.example.com -> 127.0.0.1:9091.
#   Secrets live in ./authelia/config/ (git-ignored).
name: identity

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 512
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./authelia/config:/config
    environment:
      - TZ=America/New_York
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
